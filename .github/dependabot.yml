version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Major updates (e.g. Astro, Tailwind) stay ungrouped, security fixes included: one PR each,
      # since they need manual migration and would otherwise break the whole group
      npm-minor-patch:
        update-types: ['minor', 'patch']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: chore
      include: scope

  # cms/ is deferred: security updates only, no version updates
  - package-ecosystem: npm
    directory: /cms
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Payload packages must share one version. Security updates only bump packages with an
      # advisory, so a partial bump can still happen; the CI job "CMS" turns such a PR red.
      payload:
        applies-to: security-updates
        patterns: ['payload', '@payloadcms/*']
        update-types: ['minor', 'patch']
      cms-security:
        applies-to: security-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: chore
      include: scope
