name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (typecheck, build, link/CSP checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verify (typecheck + build + check-links + check-csp)
        run: npm run verify
